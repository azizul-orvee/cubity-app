# Daily copy of the Neon database, kept outside Neon.
# Each run saves a pg_dump file on the run page (Actions → Database backup) for 90 days.
# Read-only: pg_dump never changes the database.
name: Database backup

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 3:00 AM in Sylhet
  workflow_dispatch: # "Run workflow" button for a backup on demand

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the database secret
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::Add the DATABASE_URL_UNPOOLED secret under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$DATABASE_URL_UNPOOLED" in
            *-pooler*) echo "::error::Use the direct Neon URL (host without -pooler)."; exit 1 ;;
          esac

      - name: Dump the database
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          stamp=$(TZ=Asia/Dhaka date +%Y-%m-%d)
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
          mkdir -p backup
          # pg_dump 18 can read any older Postgres server, so it keeps working after Neon upgrades.
          docker run --rm -e DATABASE_URL_UNPOOLED -v "$PWD/backup:/backup" postgres:18 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges \
              --file="/backup/cubity-'"$stamp"'.dump" "$DATABASE_URL_UNPOOLED"'
          ls -lh backup
          # An empty or tiny file means the dump failed quietly.
          size=$(stat -c %s "backup/cubity-$stamp.dump")
          if [ "$size" -lt 1024 ]; then
            echo "::error::Backup file is only $size bytes."
            exit 1
          fi

      - name: Save the backup file
        uses: actions/upload-artifact@v4
        with:
          name: cubity-db-${{ env.STAMP }}
          path: backup/*.dump
          retention-days: 90
          if-no-files-found: error
